name: Daily Site Review

# Runs the automated site-review health check once per day. The report always
# goes to the job summary; it is committed to qa/site_review_YYYYMMDD.md only
# when the result changed since the newest report there (--only-on-change), so
# green days with nothing new add no commit. The script also prunes reports
# beyond the 5-day retention window, committed in the same commit. Also
# runnable on demand.
on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  site-review:
    name: Site review & report
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run site review
      id: review
      continue-on-error: true
      run: node scripts/site-review.js --only-on-change

    - name: Commit report to qa/ (and prune old ones)
      if: always()
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # -A so reports pruned by the retention window are staged as deletions,
        # not just the new report. Scoped to qa/ so nothing else is picked up.
        git add -A qa/
        if git diff --cached --quiet; then
          echo "No report changes to commit."
        else
          git commit -m "chore(qa): site review status changed $(date -u +%Y%m%d) (keep last 5 days)"
          git push
        fi

    - name: Reflect check status
      if: steps.review.outcome == 'failure'
      run: |
        echo "::warning::Daily site review found failing checks — see the job summary."
        exit 1
